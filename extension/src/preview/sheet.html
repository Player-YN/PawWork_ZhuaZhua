<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>表格 · 爪爪</title>
    <link rel="stylesheet" href="vendor/sheet-runtime.css" />
    <link rel="stylesheet" href="officeHelp.css" />
    <link rel="stylesheet" href="workLock.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fff;
        font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex;
        flex-direction: column;
      }
      #boot {
        padding: 24px 16px;
        font-size: 13px;
        color: #6b636b;
      }
      #boot.error {
        color: #fb7185;
      }
      #app {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      @keyframes paw-breathe {
        0%, 100% { box-shadow: inset 0 0 0 0 transparent; }
        50% { box-shadow: inset 0 0 0 3px rgba(244, 63, 140, 0.55); }
      }
      #app.is-agent-pulse [class*="selection-main"],
      #app.is-agent-pulse [class*="SelectionMain"],
      #app.is-agent-pulse .univer-selection-main {
        animation: paw-breathe 1.15s ease-in-out 3;
      }
      body.is-ready #boot {
        display: none;
      }
      #sheetToast {
        position: absolute;
        left: 50%;
        bottom: 48px;
        transform: translateX(-50%);
        z-index: 40;
        max-width: 72%;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(28, 25, 23, 0.88);
        color: #fff;
        font-size: 12px;
        pointer-events: none;
      }
      #sheetToast[hidden] {
        display: none !important;
      }
      #agentUndoToast {
        position: fixed;
        right: 20px;
        bottom: 52px;
        z-index: 80;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: min(440px, calc(100% - 32px));
        padding: 10px 12px;
        border-radius: 8px;
        background: #fff;
        color: #1f1f1f;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        font-size: 13px;
        line-height: 1.35;
      }
      #agentUndoToast[hidden] {
        display: none !important;
      }
      #agentUndoToast [data-role="msg"] {
        flex: 1 1 auto;
        min-width: 0;
      }
      #agentUndoToast [data-act="undo"],
      #agentUndoToast [data-act="redo"] {
        flex: 0 0 auto;
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        background: #0f6cbd;
        color: #fff;
        font: inherit;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      #agentUndoToast [data-act="undo"]:hover,
      #agentUndoToast [data-act="redo"]:hover {
        background: #115ea3;
      }
      #agentUndoToast [data-act="undo"][hidden],
      #agentUndoToast [data-act="redo"][hidden] {
        display: none !important;
      }
      #agentUndoToast [data-act="undo"]:disabled,
      #agentUndoToast [data-act="redo"]:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #agentUndoToast [data-act="dismiss"] {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #616161;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      #agentUndoToast [data-act="dismiss"]:hover {
        background: rgba(0, 0, 0, 0.06);
      }
    </style>
  </head>
  <body>
    <div id="sheetToast" hidden></div>
    <div id="agentUndoToast" hidden>
      <button type="button" data-act="undo">← 撤销这次提问</button>
      <div data-role="msg"></div>
      <button type="button" data-act="redo" hidden>重做这次提问 →</button>
      <button type="button" data-act="dismiss" aria-label="关闭">×</button>
    </div>
    <div id="boot">正在打开表格…</div>
    <div id="app"></div>
    <script src="workLock.js"></script>
    <script type="module" src="sheet.js"></script>
  </body>
</html>
