<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Site motion lab</title>
    <style>
      html, body { margin:0; height:100%; }
      #host { width:100%; height:100%; border:0; }
    </style>
  </head>
  <body>
    <iframe id="host" title="motion-lab"></iframe>
    <script type="module">
      import { sanitizeSiteHtml } from '../../../src/agent/vnext/sessionWorkspace/siteSanitize.js';
      import { annotateSiteMotionBlueprint } from '../../../src/agent/vnext/sessionWorkspace/siteMotionBlueprint.js';
      import { mountSiteMotion, unmountSiteMotion } from '../../../src/preview/siteMotion.js';

      const params = new URLSearchParams(location.search);
      const reduced = params.get('reduced') === '1';
      const fixtureUrl = params.get('fixture') || '../fixtures/idea-shell-motion.html';
      const html = await fetch(fixtureUrl).then((r) => r.text());
      const mapped = annotateSiteMotionBlueprint(html);
      const safe = sanitizeSiteHtml(mapped.html);
      const frame = document.getElementById('host');
      const boot = () => {
        const doc = frame.contentDocument;
        window.__lab = {
          mapped,
          safe,
          handle: mountSiteMotion(doc, { reducedMotion: reduced }),
          remount() {
            unmountSiteMotion(doc);
            window.__lab.handle = mountSiteMotion(doc, { reducedMotion: reduced });
            return window.__lab.handle;
          }
        };
      };
      frame.addEventListener('load', boot, { once: true });
      frame.srcdoc = safe;
    </script>
  </body>
</html>
