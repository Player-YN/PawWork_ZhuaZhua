<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paw Work QA · semantic deck</title>
    <link rel="stylesheet" href="/src/preview/vendor/design-runtime.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #f5f5f5;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #meta {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 4;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 10px;
        border-radius: 6px;
      }
      #workspace {
        position: absolute;
        inset: 0;
      }
      #engine.paw-qa-engine {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .paw-qa-engine .tlui-layout,
      .paw-qa-engine .tl-loading {
        display: none !important;
      }
      #presentFx {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
      }
      body[data-present="1"] #engine { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="meta">tldraw harness</div>
    <div id="workspace">
      <div id="engine" class="paw-qa-engine"></div>
      <div id="presentFx" hidden aria-hidden="true"></div>
    </div>
    <script>
      window.__pawQa = { mounted: false, errors: [], themeId: '', frameId: '', snapName: '' };
    </script>
    <script type="module" src="./semantic-deck.js"></script>
  </body>
</html>
