<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>爪爪 · 产品主线思维导图</title>
  <style>
    :root {
      --void: #070709;
      --paper: #101014;
      --card: #18181e;
      --card-2: #1f1f27;
      --line: rgba(255,255,255,.1);
      --ink: #f4f1f3;
      --mute: #b4abb3;
      --faint: #7a727a;
      --rose: #f43f8c;
      --amber: #fbbf24;
      --green: #34d399;
      --violet: #c4b5fd;
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); font-family: var(--font); overflow: hidden; }

    .bar {
      position: fixed; inset: 0 0 auto 0; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
      padding: 10px 16px 18px;
      background: linear-gradient(to bottom, #070709 0%, rgba(7,7,9,.86) 62%, transparent);
    }
    .kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
    .kicker i { display: inline-block; width: 7px; height: 7px; border-radius: 99px; background: var(--rose); margin-right: 8px; }
    h1 { font-size: 16px; margin: 0; font-weight: 700; }
    .north { font-family: var(--mono); font-size: 11px; color: var(--rose); }
    .grow { flex: 1; }
    .hint { color: var(--faint); font-size: 12px; }
    button.tool {
      background: var(--card); color: var(--ink); border: 1px solid var(--line);
      border-radius: 9px; height: 30px; padding: 0 12px; cursor: pointer; font-size: 12px;
    }
    button.tool:hover { border-color: rgba(244,63,140,.45); }

    #viewport {
      position: absolute; inset: 0;
      cursor: grab;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px;
      touch-action: none;
    }
    #viewport.grabbing { cursor: grabbing; }
    #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    #links path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }

    .node {
      position: absolute;
      width: 228px;
      transform: translate(-50%, -50%);
      padding: 11px 14px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,.38);
      cursor: grab;
      user-select: none;
      white-space: normal;
      word-break: normal;
      overflow-wrap: anywhere;
    }
    .node::before {
      content: "";
      position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
      border-radius: 3px; background: rgba(255,255,255,.16);
    }
    .node.root { width: 280px; padding: 18px 16px; text-align: center; background: #1b1419; border-color: rgba(244,63,140,.5); box-shadow: 0 0 0 5px rgba(244,63,140,.12), 0 18px 40px rgba(0,0,0,.5); }
    .node.root::before { display: none; }
    .node.judge::before { background: var(--amber); }
    .node.bind::before, .node.root { }
    .node.bind::before { background: var(--rose); }
    .node.out::before { background: var(--green); }
    .node.left-over::before { background: var(--violet); }
    .node.leaf { background: var(--card-2); width: 216px; }
    .node:hover { border-color: rgba(244,63,140,.42); }
    .node.active { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(244,63,140,.22), 0 12px 28px rgba(0,0,0,.4); }
    .node .t { font-size: 13.5px; font-weight: 700; line-height: 1.35; color: var(--ink); }
    .node.root .t { font-size: 20px; letter-spacing: -.03em; }
    .node .s { margin-top: 5px; font-size: 12px; color: var(--mute); line-height: 1.45; }
    .node.root .s { color: var(--rose); font-family: var(--mono); font-size: 11.5px; }
    .node .kids {
      position: absolute; top: 50%; width: 18px; height: 18px; margin-top: -9px;
      border-radius: 99px; background: #0d0d10; border: 1px solid var(--line);
      font-size: 12px; display: grid; place-items: center; color: var(--mute);
    }
    .node .kids.r { right: -9px; }
    .node .kids.l { left: -9px; }

    .legend {
      position: fixed; left: 16px; bottom: 14px; z-index: 20;
      display: flex; gap: 12px; font-size: 11px; color: var(--mute);
    }
    .legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

    #drawer {
      position: fixed; top: 52px; right: 12px; bottom: 12px; width: min(420px, calc(100vw - 24px));
      z-index: 24; display: none; flex-direction: column;
      background: rgba(16,16,20,.94); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: -16px 0 48px rgba(0,0,0,.4); backdrop-filter: blur(16px);
    }
    #drawer.open { display: flex; }
    #drawer header {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 16px 16px 12px; border-bottom: 1px solid var(--line);
    }
    #drawer header h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; flex: 1; }
    #drawer header p { margin: 4px 0 0; color: var(--mute); font-size: 12px; }
    #x {
      background: transparent; border: 1px solid var(--line); color: var(--mute);
      width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
    }
    #drawer .body { overflow: auto; padding: 14px 16px 24px; }
    #drawer h3 { margin: 16px 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
    #drawer ul { margin: 0; padding-left: 18px; color: var(--mute); font-size: 13.5px; line-height: 1.55; }
    #drawer p { color: var(--mute); font-size: 13.5px; line-height: 1.6; margin: 0 0 8px; }
    #drawer .chip {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px;
      background: rgba(244,63,140,.14); color: var(--rose); margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="bar">
    <span class="kicker"><i></i>现状思维导图</span>
    <h1>爪爪 · 产品主线</h1>
    <span class="north">SELECT + DESCRIBE OUTCOME → DELIVER</span>
    <span class="grow"></span>
    <span class="hint">拖节点整理 · 拖空白平移 · 滚轮缩放 · 单击看详情</span>
    <button class="tool" id="fit" type="button">适配</button>
    <button class="tool" id="reset" type="button">复位布局</button>
    <button class="tool" id="expand" type="button">全部展开</button>
  </div>
  <div id="viewport"><div id="world"><svg id="links"></svg></div></div>
  <div class="legend">
    <span><i style="background:#f43f8c"></i>绑定 / 主线</span>
    <span><i style="background:#fbbf24"></i>判断</span>
    <span><i style="background:#34d399"></i>交付</span>
    <span><i style="background:#c4b5fd"></i>残留</span>
  </div>
  <aside id="drawer">
    <header>
      <div>
        <h2 id="dt"></h2>
        <p id="ds"></p>
      </div>
      <button id="x" type="button" aria-label="关闭">×</button>
    </header>
    <div class="body" id="db"></div>
  </aside>

  <script>
    const W = 228, ROOT_W = 280, DX = 320, GAP = 18, BRANCH_H = 72, LEAF_H = 70;
    const TREE = {

          { id: "tdeck", t: "deck", s: "有 pawCanvas 才出现", leaf: true },
          { id: "tweb", t: "web", s: "有 site HTML 才出现", leaf: true },

        ]},

          { id: "art2", t: "/artifacts", s: "持久。口头不算", leaf: true },
          { id: "scr", t: "/scratch", s: "回合结束扔掉", leaf: true },
          { id: "ex", t: "导出", s: "PNG / PDF / PPTX / xlsx", leaf: true }
        ]}

    const INFO = {
      root: {
        chip: "主线",
        p: "爪爪不是聊天窗，也不是编辑器商店。用户在活网页上伸爪选中，在侧栏描述想要的结果。每一句话进入同一个会话工作区循环。",
        items: ["SELECT + DESCRIBE OUTCOME → DELIVER", "模型判断答还是交付", "宿主绑定隔离、写策略、打开路由、工具库存", "交付物是 /artifacts 里对得上格式的真字节"]
      },
      cap: { chip: "输入", p: "Paw 关闭时是正常浏览。打开后，点击才进入选择通道。选中先当积木收下，这一步不做语义解释。", items: ["点选 / 多选 / 截图", "芯片标签：图片N · 截图N · 容器N · 表格N · 文字N", "「这页」指向 focusPage，不是 SelectionGroup", "@ 某一页会覆盖本轮焦点"] },

      open: { chip: "打开", p: "人从不挑编辑器。classifyOpenArtifact 看魔术字节。", items: ["json-canvas → design.html", "html-site → site.html", "xlsx/csv → sheet.html", "docx / document → docs 或 preview"] },
      dsgn: { chip: "表面", p: "无限画布。Design 自由板；Slides 同一引擎加 16:9 框和胶片条。", items: ["引擎：tldraw", "SoT：pawCanvas"] },
      site: { chip: "表面", p: "页面就是交付物。可选点选钉节点，不是建站编辑器。", items: ["data-paw-kind=site"] },
      sh: { chip: "表面", p: "Univer 活格子。Facade/Command，整本 IWorkbookData 持久化。", items: ["公式 / 图 / 选区芯片是提示不是锁"] },
      dc: { chip: "表面", p: "Univer 长文，或通用 HTML/PDF 预览。预览不是版式画板。", items: ["html-plates 不再当 Design"] },
      inv: { chip: "库存", p: "办公短工具跟会话库存走，不跟 Chrome 标签焦点走。删画布则收笔。", items: ["prepareStep 每步重读库存"] },
      tsheet: { chip: "库存", p: "会话里有工作簿才注册 sheet。", items: ["省略 A1 用焦点", "写完 dirty + readback"] },
      tdeck: { chip: "库存", p: "有 pawCanvas（海报或幻灯）才注册 deck。", items: ["点贴纸再改", "NEED_SELECTION"] },
      tweb: { chip: "库存", p: "有 site HTML 才注册 web。", items: ["改钉住的节点或整页重写"] },
      tdoc: { chip: "库存", p: "有 Univer 文档才注册 doc。", items: ["HTML document 预览不是这支笔的画布"] },
      refine: { chip: "精细化", p: "创建之后主路径不是再写一个文件，而是点中对象、说一句、写回去、读回来。", items: ["World → Act → Verify", "人也可以在画布上直接改"] },
      wld: { chip: "精细化", p: "世界卡带库存、焦点、点中的 nodeId / A1 / data-paw-node。", items: ["省略 target 用会话焦点"] },
      act: { chip: "精细化", p: "对应短工具 write。没点中就失败，不猜第一个节点。", items: ["NEED_SELECTION"] },
      ver: { chip: "精细化", p: "返回 dirty + readback。模型对照读回，不靠聊天里的愿望。", items: ["Verify 是协议，不是口号"] },
      out: { chip: "交付", p: "货架上的文件才算交付。口头不算。", items: ["导出从引擎文档编译", "删 Session 才级联删除"] },
      art2: { chip: "交付", p: "持久交付物。", items: ["只因显式删除或删会话而消失"] },
      scr: { chip: "交付", p: "执行草稿纸。回合 settle / abort 后扔掉。", items: ["不需要模型自己打扫"] },
      ex: { chip: "交付", p: "从画布引擎导出，不靠截编辑器工具栏。", items: ["Design：PNG / SVG / PDF / PPTX", "Sheet：xlsx", "需要活标签时 NEED_TAB"] }
    };

    const ORIGIN = { x: 1680, y: 1100 };
    const world = document.getElementById("world");
    const links = document.getElementById("links");
    const viewport = document.getElementById("viewport");
    const nodesLayer = document.createElement("div");
    world.appendChild(nodesLayer);

    let cam = { x: 0, y: 0, k: 1 };
    let pan = null, moving = null, moved = false, active = null;

    function walk(fn) {
      fn(TREE);
      function rec(n) { fn(n); (n.children || []).forEach(rec); }
      TREE.left.forEach(rec);
      TREE.right.forEach(rec);
    }
    function byId(id) { let h = null; walk((n) => { if (n.id === id) h = n; }); return h; }
    function visKids(n) { return n.open ? (n.children || []) : []; }
    function hOf(n) {
      const kids = visKids(n);
      if (!kids.length) return n.leaf ? LEAF_H : BRANCH_H;
      return kids.reduce((s, c) => s + hOf(c), 0) + GAP * (kids.length - 1);
    }
    function place(n, x, y, dir) {
      if (n._drag) { x = n.x; y = n.y; }
      n.x = x; n.y = y; n.side = dir;
      const kids = visKids(n);
      if (!kids.length) return;
      const H = hOf(n);
      let cy = y - H / 2;
      kids.forEach((c) => {
        const ch = hOf(c);
        place(c, n._drag ? c.x || (x + dir * DX) : x + dir * DX, n._drag && c._drag ? c.y : cy + ch / 2, dir);
        cy += ch + GAP;
      });
    }
    function layout() {
      TREE.x = ORIGIN.x; TREE.y = ORIGIN.y; TREE.side = 0;
      const space = (list) => list.reduce((s, n, i) => s + hOf(n) + (i ? GAP + 12 : 0), 0);
      let ly = ORIGIN.y - space(TREE.left) / 2;
      TREE.left.forEach((n) => { const h = hOf(n); place(n, ORIGIN.x - DX, ly + h / 2, -1); ly += h + GAP + 12; });
      let ry = ORIGIN.y - space(TREE.right) / 2;
      TREE.right.forEach((n) => { const h = hOf(n); place(n, ORIGIN.x + DX, ry + h / 2, 1); ry += h + GAP + 12; });
    }
    function colorOf(n) {
      if (n.id === "root" || n.kind === "bind" || n.id === "bind") return "#f43f8c";
      if (n.kind === "judge" || n.id === "judge") return "#fbbf24";
      if (n.kind === "out" || n.id === "out") return "#34d399";
      if (n.kind === "left-over" || n.id === "left") return "#c4b5fd";
      return "rgba(244,241,243,.32)";
    }
    function shiftTree(n, dx, dy) {
      n.x += dx; n.y += dy; n._drag = true;
      (n.children || []).forEach((c) => shiftTree(c, dx, dy));
    }

    function render() {
      layout();
      nodesLayer.innerHTML = "";
      const seen = [];
      function add(n) {
        const el = document.createElement("div");
        const side = n.side < 0 ? "left" : n.side > 0 ? "right" : "root";
        el.className = "node"
          + (n.id === "root" ? " root" : "")
          + (n.leaf ? " leaf" : "")
          + (n.kind ? " " + n.kind : "")
          + (n.id === active ? " active" : "");
        el.dataset.id = n.id;
        el.style.left = n.x + "px";
        el.style.top = n.y + "px";
        const toggle = (n.children && n.children.length)
          ? `<span class="kids ${side === "left" ? "l" : "r"}" data-toggle="1">${n.open ? "–" : "+"}</span>` : "";
        el.innerHTML = `<div class="t">${n.t}</div>${n.s ? `<div class="s">${n.s}</div>` : ""}${toggle}`;
        el.addEventListener("pointerdown", onNodeDown);
        nodesLayer.appendChild(el);
        n._el = el;
        seen.push(n);
      }
      add(TREE);
      function rec(n) { add(n); if (n.open) (n.children || []).forEach(rec); }
      TREE.left.forEach(rec);
      TREE.right.forEach(rec);

      const paths = [];
      function edge(a, b) {
        const aw = a.id === "root" ? ROOT_W : W;
        const bw = b.id === "root" ? ROOT_W : W;
        const leftward = b.x < a.x;
        const x1 = a.x + (leftward ? -aw / 2 : aw / 2);
        const x2 = b.x + (leftward ? bw / 2 : -bw / 2);
        const y1 = a.y, y2 = b.y;
        const m = (x1 + x2) / 2;
        paths.push(`<path d="M${x1} ${y1} C ${m} ${y1}, ${m} ${y2}, ${x2} ${y2}" stroke="${colorOf(a.id === "root" ? b : a)}"/>`);
      }
      TREE.left.forEach((n) => { edge(TREE, n); (function down(p) { if (!p.open) return; (p.children || []).forEach((c) => { edge(p, c); down(c); }); })(n); });
      TREE.right.forEach((n) => { edge(TREE, n); (function down(p) { if (!p.open) return; (p.children || []).forEach((c) => { edge(p, c); down(c); }); })(n); });

      let maxX = 0, maxY = 0;
      seen.forEach((n) => { maxX = Math.max(maxX, n.x + 200); maxY = Math.max(maxY, n.y + 120); });
      links.setAttribute("width", Math.max(3200, maxX));
      links.setAttribute("height", Math.max(2400, maxY));
      links.style.width = links.getAttribute("width") + "px";
      links.style.height = links.getAttribute("height") + "px";
      links.innerHTML = paths.join("");
    }

    function applyCam() { world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.k})`; }
    function fit() {
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      cam.k = Math.min(vw / 3000, vh / 2100, 1);
      cam.x = vw / 2 - ORIGIN.x * cam.k;
      cam.y = vh / 2 - ORIGIN.y * cam.k + 10;
      applyCam();
    }

    function openInfo(id) {
      const n = byId(id);
      const info = INFO[id] || { p: n.s || "", items: [] };
      active = id;
      document.getElementById("dt").textContent = n.t;
      document.getElementById("ds").innerHTML = info.chip ? `<span class="chip">${info.chip}</span>${n.s || ""}` : (n.s || "");
      const lis = (info.items || []).map((x) => `<li>${x}</li>`).join("");
      document.getElementById("db").innerHTML = `<p>${info.p || ""}</p>${lis ? `<h3>要点</h3><ul>${lis}</ul>` : ""}`;
      document.getElementById("drawer").classList.add("open");
      render();
    }

    function onNodeDown(e) {
      if (e.target.closest("[data-toggle]")) {
        e.stopPropagation();
        const n = byId(e.currentTarget.dataset.id);
        if (n && n.children) { n.open = !n.open; render(); }
        return;
      }
      e.stopPropagation();
      const id = e.currentTarget.dataset.id;
      const n = byId(id);
      moved = false;
      moving = {
        id, n,
        sx: e.clientX, sy: e.clientY,
        ox: n.x, oy: n.y
      };
      e.currentTarget.setPointerCapture(e.pointerId);
    }

    viewport.addEventListener("pointermove", (e) => {
      if (moving) {
        const dx = (e.clientX - moving.sx) / cam.k;
        const dy = (e.clientY - moving.sy) / cam.k;
        if (!moved && Math.hypot(e.clientX - moving.sx, e.clientY - moving.sy) < 6) return;
        moved = true;
        const nx = moving.ox + dx, ny = moving.oy + dy;
        shiftTree(moving.n, nx - moving.n.x, ny - moving.n.y);
        render();
        return;
      }
      if (!pan) return;
      cam.x = e.clientX - pan.x;
      cam.y = e.clientY - pan.y;
      applyCam();
    });
    viewport.addEventListener("pointerup", (e) => {
      if (moving) {
        const id = moving.id;
        if (!moved) openInfo(id);
        moving = null;
        return;
      }
      pan = null;
      viewport.classList.remove("grabbing");
    });
    viewport.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".node") || e.target.closest("#drawer") || e.target.closest(".bar")) return;
      pan = { x: e.clientX - cam.x, y: e.clientY - cam.y };
      viewport.classList.add("grabbing");
    });
    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const prev = cam.k;
      cam.k = Math.min(2.4, Math.max(0.25, cam.k * (e.deltaY > 0 ? 0.92 : 1.08)));
      const r = viewport.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      cam.x = px - (px - cam.x) * (cam.k / prev);
      cam.y = py - (py - cam.y) * (cam.k / prev);
      applyCam();
    }, { passive: false });

    document.getElementById("fit").onclick = fit;
    document.getElementById("expand").onclick = () => { walk((n) => { if (n.children) n.open = true; }); render(); };
    document.getElementById("reset").onclick = () => { walk((n) => { n._drag = false; }); render(); fit(); };
    document.getElementById("x").onclick = () => { document.getElementById("drawer").classList.remove("open"); active = null; render(); };
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") document.getElementById("x").click();
      if (e.key === "0") fit();
      if (e.key === "+" || e.key === "=") { cam.k = Math.min(2.4, cam.k * 1.1); applyCam(); }
      if (e.key === "-") { cam.k = Math.max(0.25, cam.k / 1.1); applyCam(); }
    });
    window.addEventListener("resize", fit);

    render();
    fit();
  </script>
</body>
</html>
