<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>爪爪现在怎么工作 · 一张一张讲</title>
  <style>
    :root {
      --bg: #f6f1ea;
      --ink: #1c1917;
      --muted: #78716c;
      --pink: #f43f8c;
      --card: #fffaf6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: ui-rounded, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main {
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }
    section {
      min-height: 100dvh;
      scroll-snap-align: start;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 48px);
    }
    figure {
      margin: 0;
      max-width: 1100px;
      width: min(100%, 1100px);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 24px;
      background: var(--card);
    }
    h1, p { text-align: center; margin: 0.4em 0 0; }
    h1 { font-size: clamp(1.5rem, 3.6vw, 2.4rem); letter-spacing: -0.03em; }
    p { font-size: clamp(1rem, 2vw, 1.35rem); color: var(--muted); font-weight: 650; }
    .tag {
      display: inline-block;
      background: var(--pink);
      color: white;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.35em 0.8em;
      border-radius: 999px;
      font-weight: 800;
    }
    .wrap { text-align: center; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <main>
    <section>
      <figure>
        <div class="wrap"><span class="tag">1 · 伸爪</span></div>
        <img src="eli5/a01.jpg" alt="爪子点网页" />
        <h1>先用爪子点网页</h1>
        <p>点到的东西，才是这次任务的积木。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">2 · 积木</span></div>
        <img src="eli5/a02.jpg" alt="选中变成积木" />
        <h1>选中变成托盘上的积木</h1>
        <p>图片、截图、容器、表格、文字。先收着，先不猜意思。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">3 · 说结果</span></div>
        <img src="eli5/a03.jpg" alt="侧栏书桌说话" />
        <h1>在旁边的小书桌说想要什么</h1>
        <p>不选编辑器。只说结果：海报、表、网站、还是回答。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">4 · 送信</span></div>
        <img src="eli5/a04.jpg" alt="信封穿过隧道" />
        <h1>纸条钻过隧道</h1>
        <p>侧栏 → 后台管道 → 后厨。每一句话都走同一条路。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">5 · 房子</span></div>
        <img src="eli5/a05.jpg" alt="Chrome 房子四间房" />
        <h1>房子里有四间房</h1>
        <p>书桌、网页、后厨、沙盒围栏。机器人在后厨，不能乱跑。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">6 · 看世界</span></div>
        <img src="eli5/a06.jpg" alt="机器人看世界卡片" />
        <h1>后厨先看世界卡片</h1>
        <p>积木、宝物、打开的房间。再决定：说话、看一看、捞过来、还是动手做。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">7 · 三件玩具</span></div>
        <img src="eli5/a07.jpg" alt="看一看捞过来动手做" />
        <h1>桌上永远只有三件玩具</h1>
        <p>看一看 · 捞过来 · 动手做。有玩具不代表一定要用。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">8 · 食谱</span></div>
        <img src="eli5/a08.jpg" alt="墙上的食谱卡" />
        <h1>墙上的食谱卡可以拿下来看</h1>
        <p>食谱不是新玩具。适合就看一眼，不适合就放回去。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">9 · 两只箱子</span></div>
        <img src="eli5/a09.jpg" alt="宝物箱和草稿纸" />
        <h1>宝贝进箱子，草稿纸会扔掉</h1>
        <p>箱子是交付物。草稿纸做完就走。机器人不能改你的积木托盘。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">10 · 四扇门</span></div>
        <img src="eli5/a10.jpg" alt="表图画网页四扇门" />
        <h1>做好的东西打开对应的门</h1>
        <p>格子表 · 无限画布 · 真网页 · 纸。文件类型开门，人不用挑房间。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">11 · 专用笔</span></div>
        <img src="eli5/a11.jpg" alt="箱子里有宝物才给蜡笔" />
        <h1>箱子里有对应宝物，才给专用笔</h1>
        <p>有表才给表笔。有画布才给画笔。切到别的网页，笔还在。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">12 · 表</span></div>
        <img src="eli5/a12.jpg" alt="活表格" />
        <h1>表是会算数的活格子</h1>
        <p>点格子再说。专用笔改这一格，改完回读给你看。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">13 · 画布</span></div>
        <img src="eli5/a13.jpg" alt="无限灰布和贴纸" />
        <h1>海报和幻灯片住在无限灰布上</h1>
        <p>点一张贴纸，再说改它。没有点中，机器人先问，不瞎猜。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">14 · 网页</span></div>
        <img src="eli5/a14.jpg" alt="真网页不是画板" />
        <h1>真网站是一页能点的网页</h1>
        <p>不是画板。写好 HTML，打开它。画布是给海报用的。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">15 · 沙盒</span></div>
        <img src="eli5/a15.jpg" alt="代码在围栏里玩" />
        <h1>写出来的代码关在围栏里</h1>
        <p>锤子可以在围栏里敲。房子钥匙拿不到。不能去摸真网页。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">16 · 分工</span></div>
        <img src="eli5/a16.jpg" alt="机器人想房子上锁" />
        <h1>机器人负责想，房子负责上锁</h1>
        <p>想：这是海报还是网站。锁：乱写的漂亮 HTML 进不了画布。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">17 · 错门</span></div>
        <img src="eli5/a17.jpg" alt="漂亮海报纸被弹开" />
        <h1>漂亮海报纸会从画布门弹回来</h1>
        <p>海报要变成布上的贴纸。网页才用 HTML 纸。</p>
      </figure>
    </section>
    <section>
      <figure>
        <div class="wrap"><span class="tag">18 · 先点再改</span></div>
        <img src="eli5/a18.jpg" alt="点中才改没点就问" />
        <h1>先点中，再改</h1>
        <p>点中了就改那一张。空着手，先举手问。不问完不乱改。</p>
      </figure>
    </section>
  </main>
</body>
</html>
