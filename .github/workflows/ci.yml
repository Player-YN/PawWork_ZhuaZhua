# Paw Work — continuous integration
# Runs on every push and pull_request. Local equivalent:
#   npm run ci:local
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    name: build · test · pack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build agent vendor (QuickJS / esbuild / AI SDK loaders)
        run: npm run build:agent

      - name: Session Workspace gate (S-A…S-R + extras)
        run: npm run test:session-workspace:all

      - name: Session Workspace adversarial attacks (all waves)
        run: npm run test:session-workspace:attacks

      - name: Product pack gates (QuickJS MV3 + import path)
        run: npm run test:workspace

      - name: Pack clean unpacked extension
        run: npm run pack:extension

      - name: Upload unpacked extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawwork-unpacked-${{ github.sha }}
          path: artifacts/unpacked
          if-no-files-found: error
          retention-days: 14
