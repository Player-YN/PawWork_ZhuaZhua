# Publish the ~44MB unpacked extension as:
#   1. GitHub Release zip (paw-work-unpacked.zip)
#   2. Dist branch `unpacked` (tree root = pack; manifest.json at clone root)
#
# Passersby: clone --branch unpacked (or unzip the Release) then Load unpacked.
# Do not load a source clone root. Never put the 44MB pack on `main`.
#
# Run this on https://github.com/Player-YN/PawWork_ZhuaZhua (public),
# after sync:public, with repo secret PAW_TLDRAW_LICENSE_KEY set.
# Never commit the key. A release without that secret is blocked.
# Force-push is authorized for branch `unpacked` only — never main / runtime-vnext.
name: release-unpacked

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-unpacked-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: pack · zip · Release · unpacked branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAW_TLDRAW_LICENSE_KEY: ${{ secrets.PAW_TLDRAW_LICENSE_KEY }}

    steps:
      - name: Require tldraw production key
        run: |
          if [ -z "$PAW_TLDRAW_LICENSE_KEY" ]; then
            echo "Set repository secret PAW_TLDRAW_LICENSE_KEY before releasing a passerby pack."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack clean unpacked extension
        run: npm run pack:extension

      - name: Zip loadable folder
        run: |
          mkdir -p artifacts/release
          cp -a artifacts/unpacked artifacts/release/paw-work
          test -f artifacts/release/paw-work/manifest.json
          test -f artifacts/release/paw-work/README.md
          test -f artifacts/release/paw-work/LICENSE
          test -f artifacts/release/paw-work/licenses/tldraw-LICENSE.md
          (cd artifacts/release && zip -r paw-work-unpacked.zip paw-work)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            TAG="unpacked-$(git rev-parse --short HEAD)"
          fi
          NOTES="$(printf '%s\n' \
            'Preferred: clone only branch unpacked. The last line prints the absolute path — Load unpacked that folder.' \
            '' \
            '  git clone --depth 1 --single-branch --branch unpacked https://github.com/Player-YN/PawWork_ZhuaZhua.git paw-work' \
            '  (Get-Item .\paw-work).FullName' \
            '' \
            'Clone creates paw-work under the directory where you run the command (not a fixed Desktop path). If you run it from your user home, that is C:\Users\yyy\paw-work.' \
            '' \
            'Then Chrome → chrome://extensions → Developer mode → Load unpacked → select the printed folder (the one with manifest.json).' \
            '' \
            'This zip is the same bytes. Unzip, then the same Chrome steps on the inner `paw-work` folder.' \
            '' \
            'Do not git clone the default (source) branch to install. Do not load a folder that contains node_modules.' \
            '' \
            '推荐：只克隆 unpacked 分支。克隆会在你运行命令时的当前目录下新建 paw-work，不是固定到桌面。最后一行会打印绝对路径；Chrome 加载已解压的扩展程序时选那个文件夹。不要 clone 源码仓当安装包。')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/release/paw-work-unpacked.zip --clobber
          else
            gh release create "$TAG" artifacts/release/paw-work-unpacked.zip \
              --title "Paw Work unpacked ${TAG}" \
              --notes "$NOTES"
          fi

      - name: Publish public branch unpacked
        if: github.repository == 'Player-YN/PawWork_ZhuaZhua'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          PACK="${GITHUB_WORKSPACE}/artifacts/unpacked"
          test -f "${PACK}/manifest.json"
          test -f "${PACK}/README.md"
          test -f "${PACK}/LICENSE"
          test -f "${PACK}/licenses/tldraw-LICENSE.md"
          test ! -e "${PACK}/node_modules"
          test ! -e "${PACK}/package.json"

          DIST="$(mktemp -d)"
          cp -a "${PACK}/." "${DIST}/"
          cd "${DIST}"
          git init --initial-branch=unpacked
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: unpacked ${SHORT}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin unpacked

          echo "Published dist branch unpacked from ${SHORT} (force-update authorized for this branch only)."
