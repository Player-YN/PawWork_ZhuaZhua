<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">爪爪 · 完全解放版 — Chrome is the computer</title>
  <desc id="desc">A Chrome window is the machine. The side panel agent docks onto it after you load the unpacked folder.</desc>
