    <text x="432" y="129" fill="#A39AA3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">docs</text>
    <rect x="72" y="148" width="672" height="28" rx="8" fill="#0C0C0F"/>
    <circle cx="90" cy="162" r="6" fill="none" stroke="#34D399" stroke-width="1.5"/>
    <text x="104" y="167" fill="#6B636B" font-family="Consolas, Cascadia Mono, monospace" font-size="13">https://store.example/orders</text>
  </g>

