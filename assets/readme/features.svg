<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Mechanism: action, run+sys, sheet/doc/site</title>
  <desc id="desc">Live-page highlights, a page-identity fetch into a file, and three office canvases. sys is inside run.</desc>
  <rect id="base-frame" width="1200" height="500" fill="#050506"/>
  <text x="40" y="40" fill="#F43F8C" font-family="Consolas, Cascadia Mono, monospace" font-size="15">MECHANISM</text>
  <text x="40" y="74" fill="#F5F2F4" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700">Operate the tab. Keep artifacts.</text>

  <g id="live-page">
    <rect x="40" y="96" width="430" height="280" rx="16" fill="#121214" stroke="#2A2A30"/>
    <text x="56" y="122" fill="#6B636B" font-family="Consolas, Cascadia Mono, monospace" font-size="13">action  snapshot t12</text>
    <rect x="56" y="138" width="398" height="220" rx="10" fill="#1A1A1F"/>
    <rect x="72" y="156" width="140" height="12" rx="3" fill="#3A3A42"/>
    <rect x="72" y="184" width="210" height="32" rx="6" fill="#0C0C0F" stroke="#3A3A42"/>
    <rect x="84" y="194" width="80" height="10" rx="3" fill="#6B636B"/>
    <rect x="72" y="230" width="210" height="32" rx="6" fill="#0C0C0F" stroke="#3A3A42"/>
    <rect x="84" y="240" width="110" height="10" rx="3" fill="#6B636B"/>
    <rect x="72" y="280" width="96" height="32" rx="6" fill="#2A2A30"/>
    <text x="96" y="301" fill="#A39AA3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700">Save</text>
    <text x="72" y="340" fill="#6B636B" font-family="Consolas, Cascadia Mono, monospace" font-size="12">same rev  /  no CSS selectors</text>
  </g>

  <g id="run-sys">
    <rect x="490" y="96" width="360" height="280" rx="16" fill="#0C0C0F" stroke="#34D399" stroke-width="1.5"/>
    <text x="506" y="122" fill="#34D399" font-family="Consolas, Cascadia Mono, monospace" font-size="13">run  +  sys.fetch as:page</text>
    <rect x="506" y="140" width="328" height="120" rx="10" fill="#050506"/>
    <text x="520" y="164" fill="#6B636B" font-family="Consolas, Cascadia Mono, monospace" font-size="13">await sys.fetch(&#123;</text>
    <text x="538" y="186" fill="#F5F2F4" font-family="Consolas, Cascadia Mono, monospace" font-size="13">as: "page",</text>
    <text x="538" y="208" fill="#F5F2F4" font-family="Consolas, Cascadia Mono, monospace" font-size="13">url: "/api/orders.csv",</text>
    <text x="538" y="230" fill="#F43F8C" font-family="Consolas, Cascadia Mono, monospace" font-size="13">saveTo: "/scratch/o.csv"</text>
    <text x="520" y="250" fill="#6B636B" font-family="Consolas, Cascadia Mono, monospace" font-size="13">&#125;)</text>
    <text x="506" y="360" fill="#A39AA3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">Page cookies. Not a model tool.</text>
  </g>

  <g id="action-hl">
    <rect x="72" y="230" width="210" height="32" rx="6" fill="#0C0C0F" stroke="#F43F8C" stroke-width="2"/>
    <rect x="84" y="240" width="110" height="10" rx="3" fill="#F5F2F4"/>
    <rect x="288" y="226" width="36" height="18" rx="4" fill="#F43F8C"/>
    <text x="294" y="239" fill="#050506" font-family="Consolas, Cascadia Mono, monospace" font-size="11">a7</text>
    <rect x="72" y="280" width="96" height="32" rx="6" fill="#34D399"/>
    <text x="96" y="301" fill="#050506" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700">Save</text>
    <rect x="176" y="276" width="36" height="18" rx="4" fill="#F43F8C"/>
    <text x="182" y="289" fill="#050506" font-family="Consolas, Cascadia Mono, monospace" font-size="11">a9</text>
  </g>

  <g id="fetch-pipe">
    <circle cx="524" cy="292" r="16" fill="#2A1020" stroke="#F43F8C"/>
    <text x="517" y="297" fill="#F43F8C" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">ck</text>
    <path d="M544 292 H620" stroke="#F43F8C" stroke-width="2"/>
    <polygon points="620,286 632,292 620,298" fill="#F43F8C"/>
    <rect x="640" y="272" width="88" height="40" rx="8" fill="#121214"/>
    <rect x="652" y="282" width="22" height="20" rx="3" fill="#34D399"/>
    <text x="678" y="297" fill="#F5F2F4" font-family="Consolas, Cascadia Mono, monospace" font-size="12">o.csv</text>
  </g>

  <g id="canvas-sheet">
    <rect x="870" y="96" width="290" height="84" rx="12" fill="#121214"/>
    <text x="886" y="118" fill="#6B636B" font-family="Consolas, Cascadia Mono, monospace" font-size="12">sheet</text>
    <g>
      <rect x="886" y="128" width="28" height="18" rx="2" fill="#2A1020"/>
      <rect x="918" y="128" width="28" height="18" rx="2" fill="#1A1A1F"/>
      <rect x="950" y="128" width="28" height="18" rx="2" fill="#F43F8C"/>
      <rect x="982" y="128" width="28" height="18" rx="2" fill="#1A1A1F"/>
      <rect x="1014" y="128" width="28" height="18" rx="2" fill="#1A1A1F"/>
      <rect x="1046" y="128" width="28" height="18" rx="2" fill="#2A1020"/>
      <rect x="886" y="150" width="28" height="18" rx="2" fill="#1A1A1F"/>
      <rect x="918" y="150" width="28" height="18" rx="2" fill="#34D399"/>
      <rect x="950" y="150" width="28" height="18" rx="2" fill="#1A1A1F"/>
      <rect x="982" y="150" width="28" height="18" rx="2" fill="#2A1020"/>
      <rect x="1014" y="150" width="28" height="18" rx="2" fill="#1A1A1F"/>
      <rect x="1046" y="150" width="28" height="18" rx="2" fill="#1A1A1F"/>
    </g>
  </g>

  <g id="canvas-doc">
    <rect x="870" y="192" width="290" height="84" rx="12" fill="#121214"/>
    <text x="886" y="214" fill="#6B636B" font-family="Consolas, Cascadia Mono, monospace" font-size="12">doc</text>
    <rect x="886" y="224" width="70" height="8" rx="2" fill="#F5F2F4"/>
    <rect x="886" y="238" width="200" height="6" rx="2" fill="#3A3A42"/>
    <rect x="886" y="250" width="176" height="6" rx="2" fill="#2A2A30"/>
    <rect x="1100" y="220" width="40" height="44" rx="4" fill="#1A1A1F" stroke="#3A3A42"/>
  </g>

  <g id="canvas-site">
    <rect x="870" y="288" width="290" height="88" rx="12" fill="#121214"/>
    <text x="886" y="310" fill="#6B636B" font-family="Consolas, Cascadia Mono, monospace" font-size="12">web  site</text>
    <rect x="886" y="320" width="258" height="14" rx="3" fill="#2A1020"/>
    <rect x="886" y="340" width="80" height="22" rx="4" fill="#1A1A1F"/>
    <rect x="974" y="340" width="80" height="22" rx="4" fill="#1A1A1F"/>
    <rect x="1062" y="340" width="82" height="22" rx="4" fill="#F43F8C"/>
  </g>

  <g id="plan-card">
    <rect x="40" y="396" width="1120" height="76" rx="14" fill="#121214" stroke="#2A2A30"/>
    <rect x="56" y="414" width="14" height="14" rx="3" fill="none" stroke="#F43F8C" stroke-width="2"/>
    <rect x="60" y="418" width="6" height="6" rx="1" fill="#F43F8C"/>
    <text x="82" y="426" fill="#F5F2F4" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="600">Plan card  /  this session only</text>
    <text x="82" y="450" fill="#A39AA3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14">clarify pauses the turn. acquire brings public web in. No Design/Slides.</text>
    <circle cx="1108.8" cy="421.4" r="4.164999999999999" fill="#F43F8C"/><circle cx="1117.2" cy="418.6" r="4.8999999999999995" fill="#F43F8C"/><circle cx="1125.6" cy="420.0" r="4.409999999999999" fill="#F43F8C"/><circle cx="1132.6" cy="425.6" r="3.675" fill="#F43F8C"/><ellipse cx="1120" cy="438.2" rx="12.6" ry="9.799999999999999" fill="#F43F8C"/>
  </g>
</svg>
