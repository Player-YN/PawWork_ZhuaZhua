  <text x="64" y="124" fill="#F5F2F4" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="48" font-weight="700">爪爪 · 完全解放版</text>
  <text x="64" y="168" fill="#A39AA3" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20">The browser is the computer. 爪爪 is the agent inside it.</text>
